name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for q in "хочу почитать о Южной Корее" "что почитать когда грустно"; do
          t0=$(date +%s%N)
          curl -s -m 60 -X POST https://text.pollinations.ai/openai -H "Content-Type: application/json" -H "Origin: https://moya-nora.github.io" -D /tmp/h -d "{\"model\":\"openai\",\"referrer\":\"moya-nora.github.io\",\"messages\":[{\"role\":\"system\",\"content\":\"Ты книжный советник. Ответь только JSON: {\\\"books\\\":[{\\\"t\\\":\\\"название по-русски\\\",\\\"a\\\":\\\"автор\\\",\\\"why\\\":\\\"почему, до 12 слов\\\"}]} — 8 книг.\"},{\"role\":\"user\",\"content\":\"$q\"}]}" | head -c 2500; echo; grep -i "access-control\|HTTP/" /tmp/h; echo "ms=$(( ($(date +%s%N)-t0)/1000000 ))"; done
