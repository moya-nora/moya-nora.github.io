name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          W = json.load(open("books/covers_want.json"))[:40]
          ok = 0
          for t, a in W:
              sur = a.split()[-1] if a else ""
              u = "https://www.googleapis.com/books/v1/volumes?q=" + urllib.parse.quote(f"intitle:{t}" + (f" inauthor:{sur}" if sur else "")) + "&langRestrict=ru&maxResults=10&printType=books"
              try:
                  it = json.load(urllib.request.urlopen(u, timeout=30)).get("items") or []
              except Exception as e:
                  print("ERR", t, e); continue
              best = None
              for v in it:
                  vi = v["volumeInfo"]; il = vi.get("imageLinks") or {}
                  y = int((vi.get("publishedDate") or "0")[:4] or 0)
                  if il.get("thumbnail") and (not best or y > best[0]):
                      best = (y, vi.get("publisher"), il.get("thumbnail"), vi.get("title"))
              if best and best[0] >= 2015: ok += 1
              print("GB", t, "|", best)
          print("ИТОГ: современных (2015+) обложек", ok, "из", len(W))
          PY
