name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s https://text.pollinations.ai/models | python3 -c "import json,sys;[print(m.get('name'),m.get('tier'),m.get('reasoning'),m.get('description','')[:50]) for m in json.load(sys.stdin)]"
          for m in openai-fast mistral; do sleep 46; t0=$(date +%s%N)
          curl -s -m 60 -X POST https://text.pollinations.ai/openai -H "Content-Type: application/json" -d "{\"model\":\"$m\",\"max_tokens\":700,\"referrer\":\"moya-nora.github.io\",\"messages\":[{\"role\":\"system\",\"content\":\"Ты книжный советник. Ответь только JSON: {\\\"books\\\":[{\\\"t\\\":\\\"название по-русски\\\",\\\"a\\\":\\\"автор\\\",\\\"why\\\":\\\"почему, до 12 слов\\\"}]} — 8 книг.\"},{\"role\":\"user\",\"content\":\"что почитать когда грустно\"}]}" | head -c 1800; echo; echo "$m ms=$(( ($(date +%s%N)-t0)/1000000 ))"; done
