name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -m 40 -D - -X POST https://text.pollinations.ai/openai -H 'Content-Type: application/json' -H 'Origin: https://nora-books.ru' \
            -d '{"model":"openai","messages":[{"role":"user","content":"Читатель просит: «грустно и хочу продолжить грустить». Назови 6 книг на русском. Ответь только JSON-массивом [{\"t\":\"название\",\"a\":\"автор\"}]"}]}' | head -c 3000
