name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          def g(p):
              return json.load(urllib.request.urlopen(urllib.request.Request("https://api.fantlab.ru"+p, headers={"User-Agent":"nora-probe/1.0"}), timeout=30))
          for q in ["Четвертое крыло", "Ветер и Правда"]:
              s = g("/search-works?q="+urllib.parse.quote(q)+"&page=1&onlymatches=1")
              w = (s if isinstance(s, list) else s.get("matches") or [])[0]
              print("WORK", {k: w.get(k) for k in ("work_id","rusname","name","autor_rusname","year")})
              e = g("/work/%s/extended" % w["work_id"])
              print("TOP KEYS", list(e.keys()))
              print("PARENTS", json.dumps(e.get("parents"), ensure_ascii=False)[:1500])
              cyc = None
              for grp in (e.get("parents") or {}).get("cycles") or []:
                  for c in grp:
                      cyc = cyc or c
              if cyc:
                  c = g("/work/%s/extended" % cyc["work_id"])
                  ch = c.get("children") or []
                  print("CYCLE KEYS", list(c.keys()))
                  print("CHILDREN", len(ch), json.dumps(ch[:6], ensure_ascii=False)[:2500])
          PY
