name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://moya-nora.github.io/app.html http://nora-books.ru/ https://nora-books.ru/ https://nora-books.ru/app.html https://www.nora-books.ru/; do echo "== $u"; curl -sS -m 20 -o /dev/null -w "%{http_code} -> %{redirect_url}\n" "$u" 2>&1; done
