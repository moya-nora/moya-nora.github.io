name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'P'
          import json,urllib.request,collections
          B="https://firestore.googleapis.com/v1/projects/nora-ed429/databases/(default)/documents/"
          K="AIzaSyD9yfazxfKpaEk1BNFDN61dEB3pfxT9cS4"
          for c in ["users","lookup","profiles","vaults","notify"]:
              n=0;days=collections.Counter();upd=collections.Counter();page="";err=None
              while True:
                  u=B+c+"?pageSize=300&mask.fieldPaths=__none&key="+K+("&pageToken="+page if page else "")
                  try: j=json.load(urllib.request.urlopen(u,timeout=30))
                  except Exception as e: err=str(e)[:120];break
                  for d in j.get("documents") or []:
                      n+=1;days[d["createTime"][:10]]+=1;upd[d["updateTime"][:10]]+=1
                  page=j.get("nextPageToken") or ""
                  if not page: break
              print("==",c,"всего",n,"ошибка",err)
              print(" созданы:",sorted(days.items()))
              print(" обновлялись:",sorted(upd.items()))
          P
