name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -H 'Accept: application/json' "https://api.litres.ru/foundation/api/arts/24552436" | python3 -c "import json,sys;d=json.load(sys.stdin)['payload']['data'];print('A',{k:d[k] for k in d if 'rat' in k or 'review' in k or 'vote' in k})"
          curl -sS -H 'Accept: application/json' "https://api.litres.ru/foundation/api/arts/24552436/reviews?limit=2&order=popular" | python3 -c "import json,sys;d=json.load(sys.stdin);print('S',d.get('status'),str(d.get('error'))[:200]);x=(d.get('payload') or {}).get('data') or [{}];print('K',{k:v for k,v in x[0].items() if k!='text'})"
