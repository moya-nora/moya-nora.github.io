name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'P'
          import json,urllib.request,urllib.parse
          H={"User-Agent":"moya-nora-books/1.0 (https://moya-nora.github.io)","Accept":"application/json"}
          for q in ["Исчезнувшая Флинн","Ромео и Джульетта Шекспир","Свет в августе Фолкнер"]:
            for u in ["https://api.litres.ru/foundation/api/search?q=%s&types=text_book&limit=5","https://api.litres.ru/foundation/api/search?q=%s&limit=5"]:
              try:
                j=json.load(urllib.request.urlopen(urllib.request.Request(u%urllib.parse.quote(q),headers=H),timeout=30))
                print("OK",q,u[40:70]);print(json.dumps(j,ensure_ascii=False)[:1500])
              except Exception as e: print("ERR",q,u[40:70],e)
          P
