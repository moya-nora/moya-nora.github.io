name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s "https://api.telegram.org/bot${BOT_TOKEN}/getChatMenuButton" | python3 -c "import json,sys;d=json.load(sys.stdin);r=d.get('result',{});print(r.get('type'),(r.get('web_app') or {}).get('url'))"
          curl -s -o /dev/null -w "app %{http_code}\n" https://nora-books.ru/app.html
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
