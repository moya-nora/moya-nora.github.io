name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for s in 8.8.8.8 1.1.1.1 ns1.spaceweb.ru; do echo "== $s"; dig +short nora-books.ru A @$s; dig +short www.nora-books.ru @$s; done
          curl -sI http://nora-books.ru/ | head -5
          curl -sI https://nora-books.ru/ | head -5 || true
          curl -sI https://moya-nora.github.io/ | head -5
