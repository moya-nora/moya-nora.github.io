name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://api.litres.ru/foundation/api/arts/24552436/reviews?limit=3" "https://api.litres.ru/foundation/api/arts/24552436/reviews?o=1&limit=3" "https://api.litres.ru/foundation/api/arts/24552436"; do echo "U $u"; curl -sS -H 'Accept: application/json' "$u" | head -c 1500; echo; done
