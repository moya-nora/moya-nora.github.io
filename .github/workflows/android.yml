name: Android
on:
  workflow_dispatch:
    inputs:
      version_code: { description: "versionCode (каждая загрузка в магазин - на 1 больше)", default: "1" }
      version_name: { description: "versionName", default: "1.0" }
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - name: Сборка (без подписи)
        working-directory: android
        env:
          NORA_VERSION_CODE: ${{ github.event.inputs.version_code || '1' }}
          NORA_VERSION_NAME: ${{ github.event.inputs.version_name || '1.0' }}
        run: gradle --no-daemon :app:bundleRelease :app:assembleRelease
      - name: Сложить результат
        run: |
          mkdir out
          cp android/app/build/outputs/bundle/release/app-release.aab out/
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk out/app-release.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          cp $BT/lib/apksigner.jar out/
          echo "build-tools: $BT" > out/info.txt
      - uses: actions/upload-artifact@v4
        with: { name: nora-android, path: out/, retention-days: 30 }
