name: Android
on:
  workflow_dispatch:
    inputs:
      version_code: { description: "versionCode (каждая загрузка в магазин - на 1 больше)", default: "1" }
      version_name: { description: "versionName", default: "1.0" }
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - name: Сборка (без подписи)
        working-directory: android
        env:
          NORA_VERSION_CODE: ${{ github.event.inputs.version_code || '1' }}
          NORA_VERSION_NAME: ${{ github.event.inputs.version_name || '1.0' }}
        run: gradle --no-daemon :app:bundleRelease :app:assembleRelease
      - name: Сложить результат
        run: |
          mkdir out
          cp android/app/build/outputs/bundle/release/app-release.aab out/
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk out/app-release.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          cp $BT/lib/apksigner.jar out/
          echo "build-tools: $BT" > out/info.txt
      - name: Положить в ветку android-build (не на сайт)
        run: |
          cd out
          git init -q -b android-build
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A; git commit -qm "Сборка ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" android-build
