name: Рисунки для итогов года (проба)
on:
  workflow_dispatch:
    inputs:
      scenes: {description: "сцены через запятую (пусто - все)", required: false, default: ""}
      n: {description: "вариантов на сцену", required: false, default: "2"}
      model: {description: "модель", required: false, default: "gpt-image-2"}
permissions: {contents: write}
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Рисуем
        env:
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
          IMAGE_BASE_URL: ${{ secrets.IMAGE_BASE_URL }}
          SCENES: ${{ inputs.scenes }}
          N: ${{ inputs.n }}
          IMAGE_MODEL: ${{ inputs.model }}
        run: python3 -u tools/art/gen.py
      - name: Сохранить в ветку art-trials
        run: |
          cd art_out && ls && [ "$(ls | wc -l)" -gt 0 ] || exit 0
          git init -q && git checkout -q -b art-trials
          git config user.name nora-bot && git config user.email nora-bot@users.noreply.github.com
          git fetch -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" art-trials && git reset -q --soft FETCH_HEAD || true
          mkdir -p run-${{ github.run_id }} && mv *.png run-${{ github.run_id }}/
          git add -A && git commit -q -m "пробные рисунки ${{ github.run_id }}" && git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:art-trials
