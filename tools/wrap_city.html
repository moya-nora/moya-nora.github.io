     Цифры в адресе: #y=2026&pg=2340&n=17&m=Март&mn=5&g=Фэнтези ; ?t=сек - один кадр; window.renderAt(t), window.DUR -->

  x.strokeStyle="#d8a24a";x.lineWidth=6;x.strokeRect(34,34,w-68,h-68);x.lineWidth=2;x.strokeRect(50,50,w-100,h-100);x.fillStyle="#e7bb6a";x.textAlign="center";x.font="700 66px NH";x.fillText("Мой год",w/2,h*.4);x.fillText("в книгах",w/2,h*.4+74);
  x.font="700 92px NH";x.fillText(Y,w/2,h*.62);x.font="600 30px NS";x.fillText("Нора",w/2,h*.85)},10),roughness:.6,metalness:.15});

const ovl=(L,u0,v0,u1,v1,draw,px=900)=>{const d=L.userData,w=(u1-u0)*d.w,h=(v1-v0)*d.h,ch=Math.round(px*h/w);

  m.position.copy(at(L,(u0+u1)/2,(v0+v1)/2));L.add(m);const o={c,x,t,px,ch,last:null,draw};o.set=k=>{if(k===o.last)return;o.last=k;x.clearRect(0,0,px,ch);draw(x,px,ch,k);t.needsUpdate=true};o.set(0);return o};

  x.font=`700 ${w*.13}px NC`;x.fillText("за год прочитано",w/2,h*.2);x.font=`700 ${w*.5}px NC`;x.fillText(ru(NB*k),w/2,h*.62);x.font=`700 ${w*.17}px NC`;x.fillText(plural(NB,"книга","книги","книг"),w/2,h*.82);
  x.strokeStyle="rgba(245,240,225,.8)";x.lineWidth=w*.012;x.beginPath();x.moveTo(w*.25,h*.88);x.quadraticCurveTo(w*.5,h*.94,w*.75,h*.87);x.stroke()},600);
// растяжка над трамваем - месяц

  x.globalAlpha=k;x.fillStyle=INK;x.font=`700 ${h*.46}px NH`;x.fillText(`${MON} - ${MN} ${plural(MN,"книга","книги","книг")}`,w/2,h*.8);x.globalAlpha=1},1400);
// афиша театра - жанр
const poster=ovl(L2,.49,.35,.65,.62,(x,w,h,k)=>{x.textAlign="center";x.fillStyle=RED;x.font=`700 ${w*.1}px NC`;x.fillText("весь год на сцене",w/2,h*.17);
  x.strokeStyle=RED;x.lineWidth=3;x.beginPath();x.moveTo(w*.2,h*.23);x.lineTo(w*.8,h*.23);x.stroke();
  x.globalAlpha=k;x.fillStyle=INK;x.font=`700 ${Math.min(w*.2,w*1.5/Math.max(5,GEN.length))}px NH`;x.fillText(GEN,w/2,h*.52);x.globalAlpha=1;

  for(let i=0;i<5;i++){x.beginPath();const cx=w*(.3+i*.1),cy=h*.84;for(let j=0;j<10;j++){const r=j%2?w*.012:w*.03,a=-Math.PI/2+j*Math.PI/5;x.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r)}x.fill()}},700);
// циферблат башни - страницы, стрелки крутятся пока набегает число
const clock=ovl(L1,.4388,.254,.5625,.447,(x,w,h,k)=>{const cx=w/2,cy=h/2,r=w*.46;x.fillStyle="rgba(240,226,196,.0)";
  x.strokeStyle="rgba(60,35,50,.7)";for(let i=0;i<60;i++){const a=i/60*6.283,l=i%5?r*.04:r*.09;x.lineWidth=i%5?2:5;x.beginPath();x.moveTo(cx+Math.cos(a)*(r-l),cy+Math.sin(a)*(r-l));x.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);x.stroke()}
  const hand=(a,l,wd)=>{x.lineWidth=wd;x.lineCap="round";x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+Math.sin(a)*l,cy-Math.cos(a)*l);x.stroke()};
  x.globalAlpha=.32;x.strokeStyle="#3a2232";hand(k*6.283*9+1.2,r*.7,9);hand(k*6.283*.75+3.6,r*.45,13);x.globalAlpha=1;
  x.fillStyle=INK;x.textAlign="center";x.font=`700 ${w*.25}px NH`;x.fillText(ru(PG*k),cx,cy+w*.07);x.fillStyle=RED;x.font=`700 ${w*.09}px NC`;x.fillText("страниц за год",cx,cy+w*.19);
  x.font=`700 ${w*.07}px NH`;x.fillStyle="rgba(60,35,50,.75)";x.fillText("XII",cx,cy-r*.72)},900);
// ---------- салют: искры собираются в число ----------
const sampleText=(lines,wpx)=>{const [c,x]=canv(wpx,Math.round(wpx*.62));x.fillStyle="#fff";x.textAlign="center";let y=0;
  for(const [txt,sz,f] of lines){y+=sz;x.font=`700 ${sz}px ${f}`;x.fillText(txt,wpx/2,y);y+=sz*.18}
  const d=x.getImageData(0,0,c.width,c.height).data,pts=[];for(let j=0;j<c.height;j+=3)for(let i=0;i<c.width;i+=3)if(d[(j*c.width+i)*4+3]>140)pts.push([i/c.width-.5,-(j/c.width)]);return pts};
const NF=5200,fp=new Float32Array(NF*3),fc2=new Float32Array(NF*3),fg=new THREE.BufferGeometry();fg.setAttribute("position",new THREE.BufferAttribute(fp,3));fg.setAttribute("color",new THREE.BufferAttribute(fc2,3));
const sparkT=tex(64,64,(x,w,h)=>{const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,"rgba(255,255,255,1)");g.addColorStop(.25,"rgba(255,220,150,.8)");g.addColorStop(1,"rgba(255,180,80,0)");x.fillStyle=g;x.fillRect(0,0,w,h)},0);
const fwM=new THREE.PointsMaterial({size:.085,map:sparkT,vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,fog:false});
const fw=new THREE.Points(fg,fwM);fw.frustumCulled=false;S.add(fw);
const rnd=(()=>{let s=7;return()=>(s=(s*16807)%2147483647)/2147483647})();
const mkShow=(lines,center,width,t0,launch)=>{const pts=sampleText(lines,1400),o=[];for(let i=0;i<NF;i++){const p=pts[Math.floor(rnd()*pts.length)]||[0,0];
  const L=launch[i%launch.length],th=rnd()*6.283,ph=Math.acos(2*rnd()-1),sp=1.2+rnd()*2.2;
  o.push({tx:center.x+p[0]*width,ty:center.y+p[1]*width,tz:center.z+(rnd()-.5)*.06,lx:L[0],ly:L[1],lz:center.z,
   vx:Math.sin(ph)*Math.cos(th)*sp,vy:Math.cos(ph)*sp,vz:Math.sin(ph)*Math.sin(th)*sp*.4,dl:rnd()*.35,tw:rnd()*6.28,warm:rnd()})}return {o,t0}};
const runShow=(sh,t,fade)=>{const c=[];for(let i=0;i<NF;i++){const q=sh.o[i],lt=t-sh.t0-q.dl;let x,y,z,b;
    if(lt<0){x=y=z=0;b=0}
    else if(lt<.55){const k=lt/.55;x=q.lx;y=lerp(q.ly-3.5,q.ly,1-Math.pow(1-k,2));z=q.lz;b=.35}                 // ракета летит вверх
    else{const e=lt-.55,k=Math.min(1,e/1.25),ks=1-Math.pow(1-k,3),bx=q.lx+q.vx*Math.min(e,.5)*1.6,by=q.ly+q.vy*Math.min(e,.5)*1.6-e*e*.4,bz=q.lz+q.vz*Math.min(e,.5);
      const m=k<.25?0:(k-.25)/.75,mm=m*m*(3-2*m);x=lerp(bx,q.tx,mm);y=lerp(by,q.ty,mm);z=lerp(bz,q.tz,mm);b=1-.35*(k<.6?k:0)+.35*Math.sin(t*9+q.tw)*(k>=1?1:0)}
    b*=fade;c.push(x,y,z,b,q.warm)}return c};
const show2=mkShow([["Мой "+Y,230,"NH"],["в книгах",150,"NC"]],new THREE.Vector3(0,14.2,-4.0),13,17.4,[[-1.6,10],[1.6,10]]);
const ease=t=>t<0?0:t>1?1:t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,seg=(t,a,b)=>ease((t-a)/(b-a)),lerp=(a,b,k)=>a+(b-a)*k,V=(x,y,z)=>new THREE.Vector3(x,y,z);
const pc=wpos(L4,.162,.82),pb=wpos(L3,.5,.19),pp=wpos(L2,.57,.485),pk=wpos(L1,.5007,.3506);

const K=[[0,V(1.8,12,9.5),V(1.8,0,0),38],[1.4,V(1.8,11,9),V(1.8,0,0),38],[3.4,V(0,5,15),V(0,3.4,0),40],[5.6,V(0,7.4,21),V(0,5.8,-1),44],
  [7.0,V(pc.x+.12,pc.y+.08,pc.z+1.55),pc,62],[8.2,V(pc.x+.04,pc.y+.05,pc.z+1.42),pc,62],
  [9.6,V(pb.x-.25,pb.y+.05,pb.z+4.3),V(pb.x,pb.y-.2,pb.z),58],[10.8,V(pb.x+.15,pb.y+.05,pb.z+4.05),V(pb.x,pb.y-.2,pb.z),58],
  [12.2,V(pp.x+.08,pp.y+.05,pp.z+1.95),pp,70],[13.4,V(pp.x,pp.y+.03,pp.z+1.82),pp,70],
  [15.0,V(pk.x,pk.y+.05,pk.z+2.05),pk,66],[16.6,V(pk.x,pk.y+.03,pk.z+1.9),pk,66],
  [18.6,V(0,8.6,22),V(0,7.8,-1),44],[20.5,V(0,8.8,23),V(0,7.9,-1),44]];

const dust=new THREE.Points(sg,new THREE.PointsMaterial({size:.06,map:sparkT,color:0xffd28a,transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending}));dust.frustumCulled=false;S.add(dust);
window.renderAt=t=>{const o=seg(t,1.4,3.4);hinge.rotation.z=Math.PI*o;hinge.position.y=lerp(.52,.1,o);
  glow.material.opacity=.6+.4*Math.sin(t*2.2)*(1-o*.5);glow.position.x=lerp(BW/2,0,o);glow.scale.set(1+o*1.4,1,1+o*1.4);
  const sprd=seg(t,3.0,5.0);
  layers.forEach(g=>{const d=g.userData,k=seg(t,2.2+d.delay*2.5,3.6+d.delay*2.5);g.rotation.x=lerp(-Math.PI/2,0,k);g.visible=k>.001;g.position.z=lerp(d.z*.12,d.z,sprd)});
  for(const w of walls){const A=layers[w.i],B=layers[w.i+1];w.m.visible=A.visible&&B.visible&&sprd>.02;if(!w.m.visible)continue;
    const xa=w.sd*A.userData.w*.47,xb=w.sd*B.userData.w*.47,za=A.position.z,zb=B.position.z,full=(B.userData.z-A.userData.z)/2*1.04,d=Math.hypot(xb-xa,zb-za)/2;
    const out=Math.sqrt(Math.max(0,full*full-d*d))*w.sd,xm=(xa+xb)/2+out,zm=(za+zb)/2;
    const [x0,z0,x1,z1]=w.half?[xm,zm,xb,zb]:[xa,za,xm,zm],len=Math.hypot(x1-x0,z1-z0);
