plugins { id "com.android.application" }

// Версия: увеличивай versionCode при каждой загрузке в Google Play / RuStore
def vCode = (System.getenv("NORA_VERSION_CODE") ?: "1").toInteger()
def vName = System.getenv("NORA_VERSION_NAME") ?: "1.0"

android {
    namespace "ru.norabooks.app"
    compileSdk 36
    defaultConfig {
        applicationId "ru.norabooks.app"
        minSdk 23
        targetSdk 36
        versionCode vCode
        versionName vName
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.6.2"
}
